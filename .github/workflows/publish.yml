name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PowerShell Gallery after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  powershell-gallery:
    name: Publish to PowerShell Gallery
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - run: Test-ModuleManifest ./Nvoip.psd1
      - name: Prepare module package
        run: |
          New-Item -ItemType Directory -Path ./Nvoip -Force | Out-Null
          Copy-Item ./Nvoip.psm1, ./Nvoip.psd1, ./README.md, ./LICENSE -Destination ./Nvoip
          Test-ModuleManifest ./Nvoip/Nvoip.psd1
      - name: Publish module
        if: github.event_name == 'release' || inputs.publish
        run: |
          Publish-Module -Path ./Nvoip -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Force
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
