name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  powershell:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: Test-ModuleManifest ./Nvoip.psd1
      - run: Import-Module ./Nvoip.psm1 -Force
      - run: ./tests/transport.ps1
